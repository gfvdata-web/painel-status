# Memória do daemon do Gradle (o runner do Actions tem 16 GB).
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

android.useAndroidX=true
# Cada módulo enxerga só os próprios recursos (R menor e build mais rápido).
android.nonTransitiveRClass=true

kotlin.code.style=official

# Versão do app: NÃO fixar aqui. O CI passa painelVersionCode/painelVersionName
# (variáveis ORG_GRADLE_PROJECT_*); sem elas o build local usa 1 / 0.0.0-dev.
