# Catálogo de versões do app Android do Painel de Status — fonte ÚNICA de versões.
# Nenhum build.gradle.kts escreve número de versão: tudo vem daqui (libs.*).
# Atualizar = mudar a linha aqui, deixar o CI rodar (testes + lint + APK) e
# só então commitar. Regras: .claude/rules/android.md (molde: app do Bolão F1).

[versions]
# Níveis de SDK do Android (minSdk 26 = Android 8; target = versão atual).
minSdk = "26"
compileSdk = "37"
targetSdk = "37"

# Ferramentas de build. AGP 9.4 exige Gradle >= 9.6 (wrapper em
# gradle/wrapper/gradle-wrapper.properties) e JDK >= 17.
androidGradlePlugin = "9.4.1"
# Kotlin embutido do AGP 9: os plugins Compose e serialization usam esta
# mesma versão e puxam o kotlin-gradle-plugin correspondente.
kotlin = "2.4.21"

# Bibliotecas
androidx-activity-compose = "1.13.0"
androidx-compose-bom = "2026.09.00"
androidx-lifecycle = "2.11.0"
androidx-navigation = "2.10.2"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
okhttp = "5.5.0"

# Testes. A família androidx.test fica fixada aqui porque o Compose puxa
# versões antigas (Espresso 3.5, que quebra no Android 16+ via Robolectric).
androidx-test-core = "1.7.0"
androidx-test-espresso = "3.7.0"
androidx-test-ext-junit = "1.3.0"
junit = "4.13.2"
robolectric = "4.17"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
# O BOM fixa juntas as versões de todas as bibliotecas Compose abaixo (sem version.ref).
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidx-compose-bom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
# Ícones básicos (Settings, Refresh, Send...): o pacote "extended" é grande demais.
androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidx-navigation" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }

androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-test-espresso" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
