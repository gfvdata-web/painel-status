<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Status (lista) — gfvdata-web</title>
  <link rel="stylesheet" href="css/estilo.css" />
  <link rel="stylesheet" href="css/lista.css" />
  <script>try{var t=localStorage.getItem("tema");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
  <script data-goatcounter="https://gfvdata.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <!-- Layout de teste: um cartão por site, em lista (molde B). O painel completo é o index.html. -->
  <div class="controles-topo">
    <nav class="versao-switch" aria-label="Versão da página">
      <a class="versao-switch__link" href="./" title="Painel completo">V1</a>
      <a class="versao-switch__link versao-switch__link--ativo" aria-current="page" href="lista.html" title="Layout em lista (teste)">V2</a>
    </nav>
    <div class="tema-switch" id="tema-switch" role="group" aria-label="Tema da página">
      <button type="button" class="tema-switch__btn" data-tema="light" aria-pressed="false">
        <span aria-hidden="true">☀️</span><span class="tema-switch__label">Claro</span>
      </button>
      <button type="button" class="tema-switch__btn" data-tema="dark" aria-pressed="false">
        <span aria-hidden="true">🌙</span><span class="tema-switch__label">Escuro</span>
      </button>
    </div>
  </div>

  <header class="lista-topo">
    <div class="lista-conteiner">
      <h1>Painel de status</h1>
      <p id="lista-resumo">Carregando...</p>
    </div>
  </header>

  <main class="lista-conteiner">
    <div class="lista-sites" id="lista-sites"></div>
    <p class="lista-outros" id="lista-outros"></p>
    <p class="lista-nota">Visitas = soma dos visitantes únicos por dia nos últimos 7 dias.
      <a href="./">Painel completo →</a></p>
  </main>

  <script src="js/lista.js"></script>
</body>
</html>
